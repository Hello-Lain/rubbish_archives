[project]
name = "only-research"
version = "0.1.0"
description = "ONLY multimodal hallucination evaluation and method research"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate==1.15.0",
    "einops==0.8.2",
    "flash-attn==2.8.3",
    "hydra-colorlog==1.2.0",
    "hydra-core==1.3.2",
    "importlib-metadata==9.0.1",
    "numpy==2.4.6",
    "onnx==1.22.0",
    "onnxscript==0.7.2",
    "omegaconf>=2.3,<2.4",
    "packaging==26.3",
    "pillow==12.3.0",
    "pydantic==2.13.5",
    "python-dotenv==1.2.3",
    "qwen-vl-utils==0.0.14",
    "rich==15.0.0",
    "rootutils==1.0.7",
    "sentencepiece==0.2.2",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "tqdm==4.70.1",
    "transformer-engine[pytorch]==2.8.0",
    "transformers==4.57.6",
]

[project.optional-dependencies]
eval = [
    "ms-vlmeval==0.0.19",
    "openai>=1.14.0",
]
tracking = [
    "wandb>=0.17",
]
sweeper = [
    "hydra-optuna-sweeper==1.2.0",
]
aht-tracking = [
    "swanlab==0.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]
ignore = ["ANN401"]

[tool.ruff.format]
quote-style = "double"

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv.sources]
flash-attn = { path = "/data/lcq/.cache/uv/wheelhouse/flash_attn-2.8.3-cp311-cp311-linux_x86_64.whl" }
transformer-engine-torch = { path = "/data/lcq/.cache/uv/wheelhouse/transformer_engine_torch-2.8.0-cp311-cp311-linux_x86_64.whl" }
