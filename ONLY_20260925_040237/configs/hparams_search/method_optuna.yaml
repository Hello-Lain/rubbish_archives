# @package _global_
defaults:
  - override /hydra/sweeper: optuna

optimized_metric: accuracy
hydra:
  mode: MULTIRUN
  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    storage: null
    study_name: null
    n_jobs: 1
    direction: maximize
    n_trials: 8
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 2
    params:
      method.method_config.alpha_pos: choice(1.0, 2.0, 3.0)
      method.method_config.alpha_neg: choice(0.0, 1.0)
      method.method_config.tvd_gamma: choice(0.1, 0.2, 0.5)
